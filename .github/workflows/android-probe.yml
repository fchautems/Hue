name: Hue Lab - APK test reveil Android
on:
  pull_request:
    branches: [main]
    paths:
      - "android/probe/**"
      - ".github/workflows/android-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alarm-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/d8" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build standalone alarm probe
        run: |
          export HUE_ANDROID_KEYSTORE="$RUNNER_TEMP/hue-alarm-test.jks"
          keytool -genkeypair -keystore "$HUE_ANDROID_KEYSTORE" -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=Hue Lab alarm probe'
          bash android/probe/build.sh "$RUNNER_TEMP/Hue-Reveil-1min.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Hue-Reveil-1min
          path: ${{ runner.temp }}/Hue-Reveil-1min.apk
          if-no-files-found: error
          retention-days: 14
