name: Hue Lab — APK Android
on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/d8" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Build and verify the signed prototype
        run: |
          export HUE_ANDROID_KEYSTORE="$RUNNER_TEMP/hue-lab-test.jks"
          keytool -genkeypair -keystore "$HUE_ANDROID_KEYSTORE" -storepass android \
            -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=Hue Lab prototype'
          bash android/build.sh "$RUNNER_TEMP/Hue-Lab-0.1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: hue-lab-android
          path: ${{ runner.temp }}/Hue-Lab-0.1.apk
          if-no-files-found: error
