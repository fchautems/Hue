name: Hue Lab — tests
on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "static/**/*.js"
      - "static/**/*.css"
      - "tests/**/*.cjs"
      - "templates/**/*.html"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "static/**/*.js"
      - "tests/**/*.cjs"
      - "templates/**/*.html"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python sources
        run: python -m compileall -q .
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v

      - name: Frontend syntax and copy regression
        run: |
          node --check tests/browser_ergonomics.cjs
          node --check static/solar_draft.js
          node --check static/solar.js
          node tests/test_solar_ui.cjs
          node --check static/app.js
          node tests/test_update_ui.cjs
          node --check static/v062.js
          node --check static/v063.js
          node tests/test_v062_ui.cjs
          node tests/test_v062_accessibility.cjs
          node tests/test_v063_ui.cjs
          node --check static/presence.js
          node tests/test_v064_presence.cjs

      - name: Browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          # ubuntu-latest already provides the browser libraries and Latin fonts.
          # Avoid apt's optional font packs: a slow mirror can exhaust the job.
          npx playwright install chromium
      - name: Solar preview mobile and desktop
        run: |
          python -m uvicorn hue_web:app --host 127.0.0.1 --port 8765 > /tmp/hue-web.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8765/api/solar/preview > /dev/null && break
            sleep 1
          done
          node tests/browser_solar.cjs
      - name: Activity navigation and existing capabilities
        run: |
          python -m uvicorn browser_server:app --app-dir tests --host 127.0.0.1 --port 8766 > /tmp/hue-browser.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8766/api/state > /dev/null && break
            sleep 1
          done
          node tests/browser_ergonomics.cjs
      - name: Ergonomics screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ergonomics-screenshots
          path: /tmp/hue-ergonomics-*.png
          if-no-files-found: ignore
      - name: Solar preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-preview-screenshots
          path: /tmp/hue-solar-*.png
          if-no-files-found: ignore
