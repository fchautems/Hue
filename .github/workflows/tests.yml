name: Hue Lab — tests
on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "static/**/*.js"
      - "static/**/*.css"
      - "tests/**/*.cjs"
      - "templates/**/*.html"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "static/**/*.js"
      - "tests/**/*.cjs"
      - "templates/**/*.html"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python sources
        run: python -m compileall -q .
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -v

      - name: Frontend syntax and copy regression
        run: |
          node --check static/app.js
          node tests/test_update_ui.cjs
          node --check static/v062.js
          node --check static/v063.js
          node tests/test_v062_ui.cjs
          node tests/test_v062_accessibility.cjs
          node tests/test_v063_ui.cjs
          node --check static/presence.js
          node tests/test_v064_presence.cjs
